<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>splitnest — Test Mini App Sandbox</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --tg-theme-bg-color: #F8F7F4;
      --tg-theme-text-color: #1B1B19;
      --primary: #8B5CF6;
    }
    body {
      background-color: var(--tg-theme-bg-color, #F8F7F4);
      color: var(--tg-theme-text-color, #1B1B19);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4">
  <!-- Top Bar -->
  <header class="w-full max-w-md flex items-center justify-between py-3 border-b border-purple-200/60">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-purple-900 text-white flex items-center justify-center font-bold text-sm">sn</div>
      <div>
        <h1 class="text-base font-bold tracking-tight text-purple-950">splitnest</h1>
        <div class="flex items-center space-x-1.5 text-[10px] text-purple-600 font-medium">
          <span class="w-1.5 h-1.5 rounded-full bg-purple-500 animate-pulse"></span>
          <span>Test Sandbox • @splistnest_test_bot</span>
        </div>
      </div>
    </div>
    <span class="text-[10px] font-mono bg-purple-100 text-purple-800 px-2 py-0.5 rounded-full font-bold">TEST</span>
  </header>

  <!-- Main Container -->
  <main id="app-container" class="w-full max-w-md flex-1 flex flex-col mt-4 space-y-4">
    <!-- Group & Sync Status Card -->
    <div class="bg-white/80 backdrop-blur-md rounded-2xl p-4 border border-purple-100 shadow-xs flex items-center justify-between">
      <div>
        <p class="text-[10px] font-mono uppercase text-purple-900/50 tracking-wider">Test Group</p>
        <h2 id="group-title-display" class="text-sm font-bold text-purple-950">Loading test group...</h2>
      </div>
      <div class="text-right">
        <p class="text-[10px] font-mono uppercase text-purple-900/50 tracking-wider">Test Sync</p>
        <span id="sync-status" class="inline-flex items-center text-xs font-semibold text-purple-600">
          <span class="w-2 h-2 rounded-full bg-purple-500 mr-1.5"></span> Test Mode
        </span>
      </div>
    </div>

    <!-- OCR Receipt Banner -->
    <div class="bg-gradient-to-r from-purple-500/10 to-indigo-500/10 border border-purple-200/80 rounded-2xl p-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="p-2 bg-purple-600 text-white rounded-xl">
          <i data-lucide="sparkles" class="w-4 h-4 text-amber-300"></i>
        </div>
        <div>
          <h3 class="text-xs font-bold text-purple-950">Test Gemini OCR Vision</h3>
          <p class="text-[10px] text-purple-800/80">Send receipts to test bot to verify parser.</p>
        </div>
      </div>
      <a href="https://t.me/splistnest_test_bot" target="_blank" class="px-2.5 py-1 bg-purple-600 text-white rounded-lg text-[10px] font-bold shadow-xs hover:bg-purple-700">Open Test Bot</a>
    </div>

    <!-- Active Balances & Ledger View -->
    <div id="ledger-content" class="bg-white/80 rounded-2xl p-4 border border-purple-100 shadow-xs space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-xs font-bold uppercase tracking-wider text-purple-900/60 font-mono">Test Ledger & Sheet</h3>
        <span id="member-count-badge" class="text-[10px] bg-purple-50 text-purple-700 px-2 py-0.5 rounded-full font-mono font-medium">Test Sheet: 1w7-vyYv...</span>
      </div>
      <div id="balances-list" class="space-y-2 text-xs">
        <p class="text-purple-900/40 italic text-center py-4">Connected to test database.</p>
      </div>
    </div>
  </main>

  <!-- Telegram WebApp Script Init -->
  <script>
    const CONFIG = {
      ENV: "test",
      BOT_USERNAME: "splistnest_test_bot",
      SPREADSHEET_ID: "1w7-vyYvVPO505o6UlbfI29LA8qOWtLpuWP4_lFXLym0",
      MINI_APP_URL: "https://t.me/splistnest_test_bot/test",
      DEFAULT_GAS_URL: ""
    };

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const chatId = tg?.initDataUnsafe?.chat?.id || urlParams.get('chat_id') || urlParams.get('startapp') || '';
    const groupTitle = tg?.initDataUnsafe?.chat?.title || urlParams.get('group_title') || 'Test Group';

    document.getElementById('group-title-display').innerText = groupTitle;

    // Initialize Lucide icons
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
</body>
</html>
